<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bol Metronome</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A2E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bol Metronome">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  body {
    margin: 0;
    padding: 2rem 1.5rem 3rem;
    background: #FBF6EC;
    font-family: Georgia, 'Cormorant Garamond', serif;
    color: #3A2A1E;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { text-align: center; font-size: 26px; font-weight: normal; color: #7A2E2E; margin-bottom: 0.25rem; }
  .subtitle { text-align: center; color: #7a6a55; font-size: 14px; margin-bottom: 2rem; }
  .stroke-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    width: 100%;
    margin-top: 8px;
  }
  .stroke-cell {
    border: 1px solid #D9C7A3;
    background: #FFFDF7;
    border-radius: 6px;
    padding: 4px 5px;
    font-size: 12px;
    font-weight: bold;
    color: #5a4020;
    text-align: center;
    min-width: 28px;
    transition: background 0.1s, border-color 0.1s;
  }
  .stroke-cell.silent { color: #9a8a6a; font-style: italic; font-weight: normal; }
  .stroke-cell.active { background: #F9E4B0; border-color: #B8860B; color: #7A2E2E; }
  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    border: 1px solid #D9C7A3;
    background: #FFFDF7;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .row.active { background: #F9E4B0; border-color: #B8860B; }
  .row .name {
    font-weight: bold;
    color: #7A2E2E;
    width: 100%;
    white-space: nowrap;
  }
  .row button {
    font-family: inherit;
    font-size: 14px;
    padding: 7px 16px;
    border-radius: 18px;
    border: 1px solid #B8860B;
    background: #FDF0D5;
    color: #7A2E2E;
    cursor: pointer;
    flex-shrink: 0;
  }
  .row button:hover { background: #F5E1B8; }
  .row input[type=range] { flex: 1; }
  .row .bpmOut { width: 60px; font-size: 13px; color: #7a6a4a; text-align: right; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bol Metronome</h1>
  <div class="subtitle">Each stroke has its own tempo \u2014 drill one bol at a time</div>
  <div id="rows"></div>
</div>

      label: 'dh\u0101 PAUSE ti t\u0101 t\u0101 ra-ti ra-ti t\u0101 ki ti-ki t\u0101-ghe dh\u0101 dhin dh\u0101 dhin dh\u0101',
      beats: [['dha'],[],['ti'],['ta'],['ta'],['ra','ti'],['ra','ti'],['ta'],['ka'],['ti','ka'],['ta','gha'],['dha'],['dhin'],['dha'],['dhin'],['dha']],
      vibMap: {0:'X', 8:'0', 12:'2'}
    }
  ];

  let audioCtx = null;
  let samplesLoaded = false;
  const SAMPLE_BUFFERS = {};

  function base64ToArrayBuffer(dataUri) {
    const base64 = dataUri.split(',')[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function loadSamples() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const keys = Object.keys(SAMPLES_B64);
    return Promise.all(keys.map(function(key) {
      return audioCtx.decodeAudioData(base64ToArrayBuffer(SAMPLES_B64[key])).then(function(decoded) {
        SAMPLE_BUFFERS[key] = decoded;
      });
    })).then(function() { samplesLoaded = true; });
  }

  function playSample(key, time, accent) {
    const buffer = SAMPLE_BUFFERS[key];
    if (!buffer) return;
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buffer;
    const vol = accent === 'strong' ? 1.0 : (accent === 'soft' ? 0.6 : 0.85);
    gain.gain.setValueAtTime(vol, time);
    src.connect(gain).connect(audioCtx.destination);
    src.start(time);
  }

  const rowsContainer = document.getElementById('rows');

  BOLS.forEach(function(bol) {
    const row = document.createElement('div');
    row.className = 'row';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = bol.label;
    if (bol.fullLabel) name.title = bol.fullLabel;
    const fitSize = Math.max(13, Math.min(20, 20 - Math.max(0, bol.label.length - 12) * 0.55));
    name.style.fontSize = fitSize + 'px';
    row.appendChild(name);

    if (bol.vibMap) {
      const vibNote = document.createElement('div');
      vibNote.style.cssText = 'width:100%; font-size:11px; color:#8a6a3a; margin-top:2px;';
      const vibNames = { 'X': 'sam', '2': 't\u0101l\u012b', '3': 't\u0101l\u012b', '0': 'kh\u0101l\u012b' };
      const parts = Object.keys(bol.vibMap).map(function(idx) {
        return vibNames[bol.vibMap[idx]] + '@beat ' + (parseInt(idx, 10) + 1);
      });
      vibNote.textContent = 'Accents: ' + parts.join(', ');
      row.appendChild(vibNote);
    }

    let strokeCells = null;
    if (bol.beats) {
      const strip = document.createElement('div');
      strip.className = 'stroke-strip';
      strokeCells = bol.beats.map(function(group, idx) {
        const cell = document.createElement('div');
        const isSilent = group.length === 0;
        cell.className = 'stroke-cell' + (isSilent ? ' silent' : '');
        cell.textContent = isSilent ? 'PAUSE' : group.map(function(k) {
          if (k.indexOf('+') !== -1) {
            return k.split('+').map(function(p) { return KEY_TO_LABEL[p] || p; }).join('+');
          }
          return KEY_TO_LABEL[k] || k;
        }).join('-');
        strip.appendChild(cell);
        return cell;
      });
      row.appendChild(strip);
    }

    const btn = document.createElement('button');
    btn.textContent = '\u25b6 Play';
    row.appendChild(btn);

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = 20;
    slider.max = 300;
    slider.value = 80;
    row.appendChild(slider);

    const bpmOut = document.createElement('div');
    bpmOut.className = 'bpmOut';
    bpmOut.textContent = '80 bpm';
    row.appendChild(bpmOut);

    rowsContainer.appendChild(row);

    let bpm = 80;
    let isPlaying = false;
    let nextNoteTime = 0;
    let timerId = null;
    let beatIndex = 0;

    function scheduler() {
      while (nextNoteTime < audioCtx.currentTime + 0.15) {
        const t = nextNoteTime;
        const secPerBeat = 60 / bpm;
        let cellIdx = null;
        if (bol.beats) {
          const idx = beatIndex % bol.beats.length;
          cellIdx = idx;
          const group = bol.beats[idx];
          const vib = bol.vibMap && bol.vibMap[idx];
          const accent = (vib === 'X' || vib === '2' || vib === '3') ? 'strong' : (vib === '0' ? 'soft' : null);
          const subDur = secPerBeat / group.length;
          group.forEach(function(key, i) {
            if (key.indexOf('+') !== -1) {
              key.split('+').forEach(function(k) { playSample(k, t + i * subDur, accent); });
            } else {
              playSample(key, t + i * subDur, accent);
            }
          });
          beatIndex++;
        } else {
          playSample(bol.key, t);
        }
        const delayMs = Math.max(0, (t - audioCtx.currentTime) * 1000);
        setTimeout(function() {
          if (strokeCells) {
            strokeCells.forEach(function(c) { c.classList.remove('active'); });
            strokeCells[cellIdx].classList.add('active');
          } else {
            row.classList.add('active');
            setTimeout(function() { row.classList.remove('active'); }, 80);
          }
        }, delayMs);
        nextNoteTime += secPerBeat;
      }
      timerId = setTimeout(scheduler, 25);
    }

    btn.addEventListener('click', function() {
      if (isPlaying) {
        isPlaying = false;
        clearTimeout(timerId);
        btn.textContent = '\u25b6 Play';
        if (strokeCells) strokeCells.forEach(function(c) { c.classList.remove('active'); });
        row.classList.remove('active');
        return;
      }
      function start() {
        isPlaying = true;
        btn.textContent = '\u23f8 Stop';
        beatIndex = 0;
        nextNoteTime = audioCtx.currentTime + 0.1;
        scheduler();
      }
      if (!samplesLoaded) {
        btn.textContent = 'Loading\u2026';
        loadSamples().then(start);
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        start();
      }
    });

    slider.addEventListener('input', function() {
      bpm = parseInt(this.value, 10);
      bpmOut.textContent = bpm + ' bpm';
    });
  });
})();
</script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
